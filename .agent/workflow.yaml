version: 2
name: notion-driven-autonomous-development

patrol:
  source: canonical-notion-project-db
  interval: 6h
  require_spec: true
  require_github_url: true
  require_local_repo: true

dispatch:
  primary_developer: minimax-code
  qa: codex-read-only
  final_reviewer: codex-read-only
  max_minimax_implementation_cycles: 3
  max_chatgpt_takeovers: 1
  quota_wake_interval: 2h
  max_quota_wakeups: 5

developer_team:
  schema_version: 2
  preferred_mode: concurrent
  fallback_mode: sequential-focused-subagents
  require_fallback_reason: true
  single_writer_invariant: true
  disjoint_ownership_required: true
  reviewers_are_read_only: true
  manifest_version_for_team_evidence: 2
  roles:
    - name: implementation-owner
      writes_workspace: true
      integration_owned_only: false
      can_push: false
      harness: minimax-code
      description: 唯一 writer；僅寫入 owned paths。
    - name: edge-case-inspector
      writes_workspace: false
      integration_owned_only: false
      can_push: false
      harness: minimax-code
      description: read-only；產出 findings、edge-case 與建議測試。
    - name: integration-coordinator
      writes_workspace: true
      integration_owned_only: true
      can_push: false
      harness: minimax-code
      description: 僅在 owner 與 inspector 完成後整合；只寫入 integration-owned paths。
  reviewers:
    - name: codex-qa
      writes_workspace: false
      isolated_read_only: true
      harness: codex
    - name: final-reviewer
      writes_workspace: false
      isolated_read_only: true
      harness: codex

release:
  auto_push: true
  auto_pull_request: true
  auto_merge: true
  auto_production_deploy: true
  post_deploy_smoke_seconds: 60
  rollback_on_non_200: true

stop_conditions:
  - missing_spec
  - missing_github_url
  - missing_local_repo
  - spec_ambiguity
  - security_risk_without_approval
  - notion_sync_failure
